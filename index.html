<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Mic</title>
<style>
  :root {
    --bg: #14110f;
    --panel: #1f1b18;
    --panel-2: #2a2521;
    --line: #3a332e;
    --fg: #f1ebe4;
    --muted: #a89d92;
    --accent: #ff4d6d;
    --accent-2: #ffb703;
    --ok: #4caf7d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 800; letter-spacing: .02em; font-size: 16px; }
  .brand span { color: var(--accent); }
  form { display: flex; gap: 8px; flex: 1; min-width: 260px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button, select, .linkbtn {
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--fg); cursor: pointer; font: inherit;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  button:hover, .linkbtn:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible, .linkbtn:focus-visible {
    outline: 2px solid var(--accent-2); outline-offset: 2px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 0; gap: 8px; }
  .stage {
    flex: 1; min-height: 0; position: relative; background: #000;
    border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
  }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .empty {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
    padding: 24px; gap: 8px; color: var(--muted);
  }
  .empty h2 { margin: 0; color: var(--fg); font-size: 20px; }
  .recent { display: flex; gap: 8px; flex-wrap: wrap; min-height: 0; }
  .recent button { font-size: 12px; padding: 5px 10px; max-width: 240px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; display: block; }

  .blocked {
    position: absolute; inset: 0; z-index: 2; background: var(--panel);
    display: grid; place-content: center; justify-items: center; gap: 14px;
    padding: 24px; text-align: center;
  }
  .blocked h2 { margin: 0; font-size: 18px; }
  .blocked p { margin: 0; color: var(--muted); max-width: 46ch; }
  .blocked .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Floating controls over the video */
  .float {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 3;
  }
  .fab {
    width: 56px; height: 56px; padding: 0; border-radius: 50%; justify-content: center;
    font-size: 22px; background: rgba(31,27,24,.82); border: 1px solid var(--line);
  }
  .fab.small { width: 40px; height: 40px; font-size: 18px; align-self: center; }
  .fab.on { background: var(--accent); border-color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    .fab.on { animation: pulse 1.6s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,77,109,.55); }
      70% { box-shadow: 0 0 0 14px rgba(255,77,109,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); }
    }
  }

  .dock {
    margin-top: 8px; display: flex; flex-direction: column; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .row { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
  #micBtn { min-width: 140px; font-weight: 700; justify-content: center; }
  #micBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; }
  label select { max-width: 230px; text-transform: none; letter-spacing: 0; font-size: 13px; }
  label.check { flex-direction: row; align-items: center; gap: 8px; text-transform: none;
    letter-spacing: 0; font-size: 13px; color: var(--fg); padding-bottom: 9px; }
  input[type=range] { accent-color: var(--accent); width: 130px; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .chan {
    display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
  }
  .chan[hidden] { display: none; }
  .chan-title { font-weight: 700; font-size: 12px; color: var(--accent-2); align-self: center; }
  .meter { width: 130px; height: 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .lvl { height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--accent-2), var(--accent)); }
  #status { color: var(--muted); font-size: 12px; }
  #status.err { color: var(--accent-2); }
  kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
<header>
  <div class="brand">Karaoke <span>Mic</span></div>
  <form id="loadForm">
    <input type="text" id="url" placeholder="Paste a YouTube karaoke video or playlist link" autocomplete="off">
    <button class="primary" type="submit">Load</button>
  </form>
  <a class="linkbtn" id="searchLink" href="https://www.youtube.com/results?search_query=karaoke" target="_blank" rel="noopener">Find a song on YouTube ↗</a>
  <a class="linkbtn" id="openYT" href="#" target="_blank" rel="noopener" hidden>Open this video on YouTube ↗</a>
</header>

<main>
  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <h2>Pick a song, then turn the mic on</h2>
      <div>Use “Find a song on YouTube”, copy the link of a karaoke video, and paste it above.</div>
    </div>
    <div class="float">
      <button id="floatMic" class="fab" type="button" aria-pressed="false" aria-label="Turn microphone on or off" title="Mic on/off">🎤</button>
      <button id="fsBtn" class="fab small" type="button" aria-label="Fullscreen" title="Fullscreen (Esc to exit)">⛶</button>
    </div>
  </div>
  <div class="recent" id="recent"></div>
</main>

<div class="dock">
  <div class="row">
    <button id="micBtn" type="button">🎤 Mic off</button>
    <label for="outSel" id="outWrap">Your voice plays to
      <select id="outSel"></select>
    </label>
    <button id="testBtn" type="button" title="Plays a short chime to the output chosen here">Test sound</button>
    <label for="songVol">Song volume
      <input type="range" id="songVol" min="0" max="100" value="100">
    </label>
    <label for="rev">Reverb
      <input type="range" id="rev" min="0" max="100" value="25">
    </label>
    <label class="check" for="guard"><input type="checkbox" id="guard" checked> Feedback guard</label>
  </div>

  <div class="row">
    <div class="chan" id="chan1">
      <span class="chan-title">Mic 1</span>
      <label for="inSel1">Microphone
        <select id="inSel1"><option>Press Mic on to list devices</option></select>
      </label>
      <label for="vol1">Volume
        <input type="range" id="vol1" min="0" max="200" value="100">
      </label>
      <div class="meter" title="Mic 1 level"><div class="lvl" id="level1"></div></div>
    </div>
    <div class="chan" id="chan2" hidden>
      <span class="chan-title">Mic 2</span>
      <label for="inSel2">Microphone
        <select id="inSel2"></select>
      </label>
      <label for="vol2">Volume
        <input type="range" id="vol2" min="0" max="200" value="100">
      </label>
      <div class="meter" title="Mic 2 level"><div class="lvl" id="level2"></div></div>
      <button id="removeMic" type="button">Remove</button>
    </div>
    <button id="addMic" type="button">+ Add a second mic</button>
  </div>

  <div id="status">Wear headphones so the mic doesn't pick up the song. Press <kbd>M</kbd> to toggle the mic.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function setStatus(msg, isErr) {
  const s = $('status'); s.textContent = msg; s.classList.toggle('err', !!isErr);
}
const optText = sel => sel.options[sel.selectedIndex]?.textContent || 'the selected device';

/* ---------------- YouTube ---------------- */
function parseYouTube(input) {
  let u;
  try { u = new URL(/^https?:\/\//i.test(input) ? input : 'https://' + input); } catch { return null; }
  const host = u.hostname.replace(/^www\.|^m\./, '');
  let id = null;
  if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
  else if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else {
      const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{11})/);
      if (m) id = m[2];
    }
  } else return null;
  const list = u.searchParams.get('list');
  if (!id && !list) return null;
  return { id, list };
}

function embedSrc({ id, list }) {
  const p = new URLSearchParams({ autoplay: '1', rel: '0', playsinline: '1' });
  if (id) {
    if (list) p.set('list', list);
    return `https://www.youtube.com/embed/${id}?${p}`;
  }
  p.set('listType', 'playlist'); p.set('list', list);
  return `https://www.youtube.com/embed/videoseries?${p}`;
}

let player = null, apiPromise = null, currentWatchUrl = '', loadToken = 0;

function loadYTApi() {
  if (window.YT && YT.Player) return Promise.resolve();
  if (apiPromise) return apiPromise;
  apiPromise = new Promise(resolve => {
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => resolve();
    document.head.appendChild(s);
  });
  return apiPromise;
}

function watchUrl({ id, list }) {
  return id
    ? `https://www.youtube.com/watch?v=${encodeURIComponent(id)}${list ? '&list=' + encodeURIComponent(list) : ''}`
    : `https://www.youtube.com/playlist?list=${encodeURIComponent(list)}`;
}

/* Song volume (only possible for videos playing inside this page) */
function songVolUI() {
  const ok = !!(player && typeof player.setVolume === 'function');
  $('songVol').disabled = !ok;
  $('songVol').title = ok ? '' : 'Works for videos playing inside this page';
}
function applySongVol() {
  if (player && typeof player.setVolume === 'function') {
    try { player.setVolume(+$('songVol').value); } catch {}
  }
}

function openPopup() {
  const w = window.open(currentWatchUrl, 'karaokeVideo', 'popup=yes,width=1100,height=660');
  if (!w) setStatus('Your browser blocked the pop-up. Use the “Open on YouTube” link instead.', true);
  else setStatus('Video opened in its own window. Put it next to this one, then press the mic button.');
}

function showBlocked() {
  const stage = $('stage');
  stage.querySelector('.blocked')?.remove();
  const box = document.createElement('div');
  box.className = 'blocked';
  box.innerHTML =
    '<h2>This video can’t play inside this page</h2>' +
    '<p>The uploader has turned off playback on other websites. Your mic still works here. ' +
    'Open the song in its own window, place it next to this one, and sing as usual.</p>' +
    '<div class="row"><button type="button" class="primary" id="popBtn">Open in a pop-up window</button>' +
    '<a class="linkbtn" id="ytLink" target="_blank" rel="noopener">Open on YouTube ↗</a></div>';
  stage.appendChild(box);
  $('ytLink').href = currentWatchUrl;
  $('popBtn').onclick = openPopup;
  $('songVol').disabled = true;
  $('songVol').title = 'Not available for pop-up videos. Use the volume in that window.';
  setStatus('This video blocks embedding. Use the pop-up button; your mic keeps working.', true);
}

async function mountPlayer(parsed) {
  const stage = $('stage');
  const token = ++loadToken;
  $('empty')?.remove();
  stage.querySelector('.blocked')?.remove();
  try { player?.destroy(); } catch {}
  player = null;
  songVolUI();
  stage.querySelector('iframe')?.remove();
  stage.querySelector('#ytHost')?.remove();

  currentWatchUrl = watchUrl(parsed);
  $('openYT').href = currentWatchUrl;
  $('openYT').hidden = false;

  const host = document.createElement('div');
  host.id = 'ytHost';
  stage.insertBefore(host, stage.firstChild);

  await loadYTApi();
  if (token !== loadToken) return;

  if (!(window.YT && YT.Player)) {
    // Player API didn't load: fall back to a plain embed (can't detect blocked videos).
    host.remove();
    const f = document.createElement('iframe');
    f.src = embedSrc(parsed);
    f.title = 'YouTube karaoke video';
    f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    stage.insertBefore(f, stage.firstChild);
    return;
  }

  const vars = { autoplay: 1, rel: 0, playsinline: 1 };
  if (parsed.list) vars.list = parsed.list;
  if (!parsed.id) vars.listType = 'playlist';
  player = new YT.Player('ytHost', {
    width: '100%', height: '100%',
    videoId: parsed.id || undefined,
    playerVars: vars,
    events: {
      onReady: () => { songVolUI(); applySongVol(); },
      onError: e => {
        if ([101, 150, 152, 153].includes(e.data)) showBlocked();
        else if (e.data === 100) setStatus('YouTube says this video was removed or is private.', true);
        else setStatus('YouTube couldn’t play this video (error ' + e.data + ').', true);
      },
    },
  });
}

function loadVideo(raw) {
  const parsed = parseYouTube(raw.trim());
  if (!parsed) { setStatus('That doesn’t look like a YouTube link. Copy the address from the video page.', true); return; }
  mountPlayer(parsed);
  rememberVideo(raw.trim());
  setStatus(running ? 'Playing. Your mic is live.' : 'Loaded. Press the mic button when you’re ready to sing.');
}

function recentList() { try { return JSON.parse(store.get('recent', '[]')); } catch { return []; } }
function rememberVideo(url) {
  const list = [url, ...recentList().filter(u => u !== url)].slice(0, 6);
  store.set('recent', JSON.stringify(list));
  renderRecent();
}
function renderRecent() {
  const box = $('recent'); box.innerHTML = '';
  recentList().forEach(u => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = u.replace(/^https?:\/\/(www\.)?/, ''); b.title = u;
    b.onclick = () => { $('url').value = u; loadVideo(u); };
    box.appendChild(b);
  });
}

$('loadForm').addEventListener('submit', e => { e.preventDefault(); if ($('url').value.trim()) loadVideo($('url').value); });
$('url').addEventListener('paste', () => setTimeout(() => { if (parseYouTube($('url').value.trim())) loadVideo($('url').value); }, 0));

/* ---------------- Mic engine ---------------- */
const GUARD_RMS = 0.4;   // steady level that counts as a feedback squeal
const GUARD_MS = 1200;   // how long it must last before the mic is muted

const channels = [
  { n: 1, sel: $('inSel1'), vol: $('vol1'), level: $('level1'), stream: null, src: null, gain: null, an: null, buf: null },
  { n: 2, sel: $('inSel2'), vol: $('vol2'), level: $('level2'), stream: null, src: null, gain: null, an: null, buf: null },
];
let ctx = null, mixBus, dryGain, wetGain, convolver, shaper, guardAn, guardBuf;
let running = false, starting = false, tickTimer = null, lastStartAt = 0, loudSince = 0;
let use2 = false, note = '';
const groups = {}; // deviceId -> groupId, to tell when two entries are the same physical mic

const canPickOutput = typeof AudioContext !== 'undefined' && 'setSinkId' in AudioContext.prototype;
if (!canPickOutput) $('outWrap').hidden = true;

function makeImpulse(ac, seconds = 1.8, decay = 3) {
  const len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

// Soft clipper: leaves normal levels untouched, rounds off loud peaks, adds no gain.
function softClipCurve(n = 2048) {
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x);
    const y = a <= 0.6 ? a : 0.6 + 0.4 * Math.tanh((a - 0.6) / 0.4);
    c[i] = Math.sign(x) * y;
  }
  return c;
}

function fillSelect(sel, list, saved, emptyText, word, avoidGroup) {
  const current = sel.value;
  sel.innerHTML = '';
  if (!list.length) {
    const o = document.createElement('option'); o.value = ''; o.textContent = emptyText; sel.appendChild(o);
    return;
  }
  list.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label || `${word} ${i + 1}`;
    sel.appendChild(o);
  });
  const ids = list.map(d => d.deviceId);
  let pick = ids.includes(saved) ? saved : (ids.includes(current) ? current : '');
  if (!pick && avoidGroup !== undefined) {
    pick = list.find(d => d.groupId !== avoidGroup)?.deviceId || '';
  }
  sel.value = pick || ids[0];
}

async function refreshDevices() {
  let devs = [];
  try { devs = await navigator.mediaDevices.enumerateDevices(); } catch {}
  devs = devs.filter(d => d.deviceId !== 'communications');
  const ins = devs.filter(d => d.kind === 'audioinput');
  const outs = devs.filter(d => d.kind === 'audiooutput');
  devs.forEach(d => { groups[d.deviceId] = d.groupId; });
  fillSelect(channels[0].sel, ins, store.get('inDev1', store.get('inDev', '')), 'No microphone found', 'Microphone');
  fillSelect(channels[1].sel, ins, store.get('inDev2', ''), 'No microphone found', 'Microphone',
             groups[channels[0].sel.value]);
  fillSelect($('outSel'), outs, store.get('outDev', ''), 'System default', 'Output');
}

function sameDevice(a, b) {
  return !!a && !!b && (a === b || (groups[a] && groups[a] === groups[b]));
}

async function openStream(ch) {
  const build = id => ({
    audio: {
      deviceId: id ? { exact: id } : undefined,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false,
      channelCount: 1, latency: 0,
    },
  });
  try {
    ch.stream = await navigator.mediaDevices.getUserMedia(build(ch.sel.value));
  } catch (err) {
    if (err.name === 'OverconstrainedError' || err.name === 'NotFoundError') {
      ch.stream = await navigator.mediaDevices.getUserMedia(build(''));   // saved mic is gone
    } else throw err;
  }
}
function stopStream(ch) { ch.stream?.getTracks().forEach(t => t.stop()); ch.stream = null; }

function setMicUI(on) {
  $('micBtn').textContent = on ? '🎤 Mic on' : '🎤 Mic off';
  $('micBtn').classList.toggle('on', on);
  $('floatMic').classList.toggle('on', on);
  $('floatMic').setAttribute('aria-pressed', String(on));
}

function applyMix() {
  if (!running) return;
  channels.forEach(ch => { if (ch.gain) ch.gain.gain.value = ch.vol.value / 100; });
  const r = $('rev').value / 100;
  dryGain.gain.value = 1 - r * 0.4;
  wetGain.gain.value = r * 1.2;
}

async function startMic() {
  if (running || starting) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('This browser can’t access the mic here. Open the app from localhost or an https address.', true);
    return;
  }
  starting = true;
  try {
    const [c1, c2] = channels;
    await openStream(c1);
    await refreshDevices();   // labels and real device ids are only available after permission
    const real = c1.stream.getAudioTracks()[0]?.getSettings?.().deviceId;
    if (c1.sel.value && real && c1.sel.value !== real) {   // apply the saved choice on the first run
      stopStream(c1);
      await openStream(c1);
    }

    let warn2 = '';
    if (use2) {
      if (!c2.sel.value) warn2 = 'Pick a microphone for Mic 2.';
      else if (sameDevice(c1.sel.value, c2.sel.value)) warn2 = 'Mic 2 is the same microphone as Mic 1, so it was left off.';
      else {
        try { await openStream(c2); }
        catch (e) { warn2 = `Couldn’t open Mic 2 (${e.message}).`; c2.stream = null; }
      }
    }

    ctx = new AudioContext({ latencyHint: 'interactive' });
    let outLabel = 'the system default output', sinkWarn = '';
    if (canPickOutput && $('outSel').value) {
      const label = optText($('outSel'));
      try { await ctx.setSinkId($('outSel').value); outLabel = label; }
      catch (e) {
        sinkWarn = `Couldn’t send your voice to “${label}” (${e.name || 'error'}), so it’s going to the system default instead. ` +
                   'Pick another output and press Mic on again, or use Test sound to check.';
      }
    }
    await ctx.resume();

    mixBus = ctx.createGain();
    dryGain = ctx.createGain(); wetGain = ctx.createGain();
    convolver = ctx.createConvolver(); convolver.buffer = makeImpulse(ctx);
    shaper = ctx.createWaveShaper(); shaper.curve = softClipCurve(); shaper.oversample = '2x';
    guardAn = ctx.createAnalyser(); guardAn.fftSize = 1024; guardBuf = new Float32Array(guardAn.fftSize);

    mixBus.connect(guardAn);
    mixBus.connect(dryGain).connect(shaper);
    mixBus.connect(convolver).connect(wetGain).connect(shaper);
    shaper.connect(ctx.destination);

    channels.forEach(ch => {
      if (!ch.stream) return;
      ch.src = ctx.createMediaStreamSource(ch.stream);
      ch.gain = ctx.createGain();
      ch.an = ctx.createAnalyser(); ch.an.fftSize = 512; ch.buf = new Float32Array(ch.an.fftSize);
      ch.src.connect(ch.gain);
      ch.gain.connect(ch.an);
      ch.gain.connect(mixBus);
    });

    running = true;
    lastStartAt = Date.now();
    applyMix();
    loudSince = 0;
    tickTimer = setInterval(tick, 50);
    setMicUI(true);

    const ms = Math.round(((ctx.baseLatency || 0) + (ctx.outputLatency || 0)) * 1000);
    const live = `Live → ${outLabel}.` + (ms > 0 ? ` Browser audio delay about ${ms} ms, plus your mic and speakers.` : '');
    if (sinkWarn) setStatus(note + sinkWarn, true);
    else if (warn2) setStatus(note + warn2, true);
    else if (c2.stream) setStatus(note + live + ' Two open mics make feedback more likely, so keep both volumes low.');
    else setStatus(note + live);
    note = '';
  } catch (err) {
    const denied = err.name === 'NotAllowedError';
    stopMic();
    setStatus(denied ? 'Mic access was blocked. Click the lock icon in the address bar, allow the microphone, and try again.'
                     : 'Couldn’t start the mic: ' + err.message, true);
  } finally {
    starting = false;
  }
}

function stopMic() {
  running = false;
  clearInterval(tickTimer); tickTimer = null; loudSince = 0;
  channels.forEach(ch => {
    try { ch.src?.disconnect(); ch.gain?.disconnect(); } catch {}
    stopStream(ch);
    ch.src = ch.gain = ch.an = ch.buf = null;
    ch.level.style.width = '0';
  });
  guardAn = null;
  try { ctx?.close(); } catch {}
  ctx = null;
  setMicUI(false);
}

function feedbackTrip() {
  stopMic();
  setStatus('Feedback detected, so the mic was muted. Turn the speakers down, lower the mic volume, or move the mic away from the speakers, then press Mic on.', true);
}

function tick() {
  if (!running) return;
  const now = performance.now();
  for (const ch of channels) {
    if (!ch.an) { ch.level.style.width = '0'; continue; }
    ch.an.getFloatTimeDomainData(ch.buf);
    let peak = 0;
    for (const v of ch.buf) { const a = Math.abs(v); if (a > peak) peak = a; }
    ch.level.style.width = Math.min(100, peak * 140) + '%';
  }
  if ($('guard').checked && guardAn) {
    guardAn.getFloatTimeDomainData(guardBuf);
    let s = 0;
    for (const v of guardBuf) s += v * v;
    const rms = Math.sqrt(s / guardBuf.length);
    if (rms > GUARD_RMS) {
      if (!loudSince) loudSince = now;
      else if (now - loudSince > GUARD_MS) feedbackTrip();
    } else loudSince = 0;
  }
}

function toggleMic() { if (running) { stopMic(); setStatus('Mic off.'); } else startMic(); }
async function restartIfRunning() { if (running) { stopMic(); await startMic(); } }

/* Test sound: a short two-note chime to the chosen output, so you can hear whether routing is right */
async function testSound() {
  let ac;
  try {
    ac = new AudioContext();
    let where = 'the system default output';
    if (canPickOutput && $('outSel').value) {
      await ac.setSinkId($('outSel').value);
      where = optText($('outSel'));
    }
    await ac.resume();
    const t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.connect(ac.destination);
    [[523.25, 0], [659.25, 0.3]].forEach(([f, off]) => {
      const o = ac.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.18, t + off + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.28);
      o.start(t + off); o.stop(t + off + 0.3);
    });
    setTimeout(() => ac.close().catch(() => {}), 1200);
    setStatus(`Test chime sent to: ${where}. If you didn’t hear it, pick a different output in “Your voice plays to”.`);
  } catch (err) {
    try { ac?.close(); } catch {}
    setStatus('Couldn’t play the test sound: ' + (err.message || err.name), true);
  }
}

/* ---------------- Wiring ---------------- */
$('micBtn').onclick = toggleMic;
$('floatMic').onclick = toggleMic;
$('testBtn').onclick = testSound;
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const p = $('stage').requestFullscreen?.();
  p?.catch(() => setStatus('Fullscreen isn’t available here.', true));
};
document.addEventListener('keydown', e => {
  if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey &&
      !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) toggleMic();
});

channels.forEach(ch => {
  ch.vol.oninput = () => { applyMix(); store.set('vol' + ch.n, ch.vol.value); };
  ch.sel.onchange = () => { store.set('inDev' + ch.n, ch.sel.value); restartIfRunning(); };
});
$('rev').oninput = () => { applyMix(); store.set('rev', $('rev').value); };
$('outSel').onchange = () => { store.set('outDev', $('outSel').value); restartIfRunning(); };
$('songVol').oninput = () => { applySongVol(); store.set('songVol', $('songVol').value); };
$('guard').onchange = () => { store.set('guard', $('guard').checked ? '1' : '0'); loudSince = 0; };

function setUse2(on) {
  use2 = on;
  store.set('use2', on ? '1' : '0');
  $('chan2').hidden = !on;
  $('addMic').hidden = on;
}
$('addMic').onclick = async () => {
  setUse2(true);
  await refreshDevices();
  setStatus('Mic 2 added. Pick its microphone, and keep both volumes low to avoid feedback.');
  restartIfRunning();
};
$('removeMic').onclick = () => { setUse2(false); restartIfRunning(); };

// Reconnect automatically when devices are plugged in, unplugged, or the Windows default changes.
let devTimer = null;
navigator.mediaDevices?.addEventListener?.('devicechange', () => {
  clearTimeout(devTimer);
  devTimer = setTimeout(async () => {
    await refreshDevices();
    if (running && Date.now() - lastStartAt > 2000) {
      note = 'Audio devices changed, so the mic was reconnected. ';
      stopMic();
      await startMic();
    }
  }, 500);
});

/* ---------------- Boot ---------------- */
channels.forEach(ch => { ch.vol.value = store.get('vol' + ch.n, ch.n === 1 ? store.get('vol', '100') : '100'); });
$('rev').value = store.get('rev', 25);
$('songVol').value = store.get('songVol', 100);
$('guard').checked = store.get('guard', '1') === '1';
setUse2(store.get('use2', '0') === '1');
songVolUI();
renderRecent();
refreshDevices();
</script>
</body>
</html>
